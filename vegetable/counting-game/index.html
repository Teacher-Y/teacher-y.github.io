<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🥦🥕蔬菜计数大挑战🌽🥬</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Comic Sans MS', 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0;
            margin: 0;
        }

        .container {
            background: transparent;
            border-radius: 20px;
            box-shadow: none;
            padding: 0;
            max-width: 100%;
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .container.game-active {
            background: white;
            border-radius: 0;
            box-shadow: none;
            padding: 0;
            max-width: 100%;
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1em;
        }

        .score-board {
            display: flex;
            justify-content: space-around;
            margin-bottom: 8px;
            background: #f0f0f0;
            padding: 8px;
            border-radius: 10px;
            flex-shrink: 0;
        }

        .score-item {
            text-align: center;
        }

        .score-label {
            color: #666;
            font-size: 0.75em;
            margin-bottom: 2px;
        }

        .score-value {
            font-size: 1.3em;
            font-weight: bold;
            color: #667eea;
        }

        .game-area {
            text-align: center;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 0 10px;
        }

        .image-container {
            margin: 0;
            background: #f9f9f9;
            border-radius: 10px;
            display: none;
            flex-shrink: 0;
        }

        .image-container.active {
            display: block;
        }

        .game-image {
            max-width: 100%;
            max-height: 280px;
            height: auto;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .question {
            font-size: 1.1em;
            color: #333;
            margin: 8px 0 4px 0;
            font-weight: bold;
        }

        .vegetable-label {
            display: inline-block;
            padding: 6px 12px;
            background: #FFE4B5;
            border-radius: 25px;
            margin: 2px 0;
            font-size: 0.95em;
            color: #D2691E;
            font-weight: bold;
        }

        /* New layout: input on top, button and keypad below */
        .input-section {
            display: flex;
            flex-direction: column;
            gap: 12px;
            justify-content: center;
            align-items: center;
            margin: 8px 0;
            flex-shrink: 0;
            width: 100%;
            padding: 0 10px;
        }

        .input-row {
            display: flex;
            justify-content: center;
            width: 100%;
        }

        input[type="number"] {
            padding: 12px 16px;
            font-size: 1.1em;
            border: 2px solid #667eea;
            border-radius: 8px;
            width: 120px;
            text-align: center;
            font-weight: bold;
        }

        input[type="number"]:focus {
            outline: none;
            border-color: #764ba2;
            box-shadow: 0 0 10px rgba(118, 75, 162, 0.3);
        }

        /* Container for button and keypad on same row */
        .controls-row {
            display: flex;
            gap: 12px;
            justify-content: center;
            align-items: flex-start;
            width: 100%;
            flex-wrap: wrap;
        }

        button {
            padding: 12px 24px;
            font-size: 1em;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.2s, box-shadow 0.2s;
            height: fit-content;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(118, 75, 162, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .keypad {
            display: grid;
            grid-template-columns: repeat(3, 50px);
            gap: 6px;
        }

        .keypad-button {
            padding: 10px 8px;
            font-size: 0.95em;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .keypad-button:hover {
            transform: scale(1.05);
            box-shadow: 0 3px 10px rgba(118, 75, 162, 0.3);
        }

        .keypad-button:active {
            transform: scale(0.98);
        }

        .keypad-button.clear {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        .keypad-button.delete {
            background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
        }

        .keyboard-hint {
            font-size: 0.8em;
            color: #999;
            margin-top: 6px;
            text-align: center;
        }

        .feedback {
            margin-top: 8px;
            padding: 10px;
            border-radius: 8px;
            font-size: 0.9em;
            font-weight: bold;
            display: none;
            flex-shrink: 0;
        }

        .feedback.show {
            display: block;
        }

        .feedback.correct {
            background: #90EE90;
            color: #228B22;
            border: 2px solid #228B22;
        }

        .feedback.incorrect {
            background: #FFB6C6;
            color: #C41E3A;
            border: 2px solid #C41E3A;
        }

        .start-screen {
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 30px;
            min-height: calc(100vh - 80px);
            padding: 40px 20px;
        }

        .start-screen h1 {
            font-size: 3.5em;
            color: white;
            margin: 0;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
            letter-spacing: 0.05em;
        }

        .start-screen .subtitle {
            font-size: 1.5em;
            color: white;
            margin: 0;
            font-weight: 500;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }

        .start-screen p {
            font-size: 1.1em;
            color: #666;
            margin: 20px 0;
        }

        .vegetable-decoration {
            display: flex;
            justify-content: center;
            gap: 15px;
            font-size: 2.5em;
            margin: 20px 0;
        }

        .start-button {
            padding: 15px 40px;
            font-size: 1.3em;
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
            color: white;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .start-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }

        .start-button:active {
            transform: translateY(-1px);
        }

        .end-screen {
            text-align: center;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 20px;
            min-height: 100vh;
            padding: 40px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            width: 100%;
        }

        .end-screen.active {
            display: flex;
        }

        .end-screen h1 {
            font-size: 3em;
            color: white;
            margin: 0;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .emoji {
            font-size: 4em;
            margin: 20px 0;
            animation: bounce 0.6s infinite alternate;
        }

        @keyframes bounce {
            from { transform: translateY(0); }
            to { transform: translateY(-20px); }
        }

        .final-score {
            font-size: 2.5em;
            font-weight: bold;
            color: #FFD700;
            margin: 20px 0;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .game-screen {
            display: none;
            flex-direction: column;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .game-screen.active {
            display: flex;
        }

        .game-screen .game-area {
            flex: 1;
            overflow-y: auto;
        }

        .timer-container {
            text-align: center;
            padding: 10px;
            background: #f0f0f0;
            border-bottom: 1px solid #ddd;
            flex-shrink: 0;
        }

        .timer {
            font-size: 1.3em;
            font-weight: bold;
            color: #667eea;
        }

        .timer.warning {
            color: #ff6b6b;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        @media (max-width: 600px) {
            .keypad {
                grid-template-columns: repeat(3, 45px);
                gap: 5px;
            }

            .keypad-button {
                padding: 8px 6px;
                font-size: 0.9em;
            }

            input[type="number"] {
                width: 100px;
                padding: 10px 12px;
                font-size: 1em;
            }

            button {
                padding: 10px 20px;
                font-size: 0.95em;
            }
        }
    </style>
</head>

<body>
    <div class="container" id="container">
        <!-- Start Screen -->
        <div class="start-screen" id="startScreen">
            <h1>🥦🥕蔬菜计数大挑战🌽🥬</h1>
            <button class="start-button" onclick="startGame()">START GAME</button>
        </div>

        <!-- Game Screen -->
        <div class="game-screen" id="gameScreen">
            <div class="timer-container">
                <div class="timer" id="timer">30</div>
            </div>

            <div class="score-board">
                <div class="score-item">
                    <div class="score-label">Score</div>
                    <div class="score-value" id="score">0</div>
                </div>
                <div class="score-item">
                    <div class="score-label">Question</div>
                    <div class="score-value" id="question">1/5</div>
                </div>
            </div>

            <div class="game-area">
                <div class="image-container active" id="imageContainer">
                    <img id="gameImage" class="game-image" src="" alt="Vegetable image">
                </div>

                <p class="question">How many <span class="vegetable-label" id="vegetableLabel">vegetable</span> do you see?</p>

                <!-- Improved Layout: Input on top, Button and Keypad on same row below -->
                <div class="input-section">
                    <div class="input-row">
                        <input type="number" id="answerInput" placeholder="0" min="0" max="20">
                    </div>

                    <div class="controls-row">
                        <button onclick="submitAnswer()">Submit</button>
                        <div class="keypad">
                            <button class="keypad-button number" onclick="addToInput('1')">1</button>
                            <button class="keypad-button number" onclick="addToInput('2')">2</button>
                            <button class="keypad-button number" onclick="addToInput('3')">3</button>
                            <button class="keypad-button number" onclick="addToInput('4')">4</button>
                            <button class="keypad-button number" onclick="addToInput('5')">5</button>
                            <button class="keypad-button number" onclick="addToInput('6')">6</button>
                            <button class="keypad-button number" onclick="addToInput('7')">7</button>
                            <button class="keypad-button number" onclick="addToInput('8')">8</button>
                            <button class="keypad-button number" onclick="addToInput('9')">9</button>
                            <button class="keypad-button clear" onclick="clearInput()">Clear</button>
                            <button class="keypad-button number" onclick="addToInput('0')">0</button>
                            <button class="keypad-button delete" onclick="deleteLastDigit()">Delete</button>
                        </div>
                    </div>

                    <div class="keyboard-hint">Press Enter to submit</div>
                </div>

                <div class="feedback" id="feedback"></div>
            </div>
        </div>

        <!-- End Screen -->
        <div class="end-screen" id="endScreen">
            <h1>Game Over! 🎉</h1>
            <div class="emoji" id="endEmoji">🎊</div>
            <p style="font-size: 1.2em; color: white;">Your Final Score:</p>
            <div class="final-score" id="finalScore">0/5</div>
            <p style="font-size: 1.1em; color: white; margin: 20px 0;" id="endMessage"></p>
            <button class="start-button" onclick="location.reload()" style="width: auto;">PLAY AGAIN</button>
        </div>
    </div>

    <script>
        let gameData = [];
        let currentImageIndex = 0;
        let currentVegetableIndex = 0;
        let currentScore = 0;
        let totalQuestions = 0;
        let currentQuestion = 0;
        let currentGame = null;
        let currentVegetable = null;
        let vegetables = [];
        let timerInterval = null;
        let timeRemaining = 30;
        const TIMER_DURATION = 30;

        function startTimer() {
            timeRemaining = TIMER_DURATION;
            const timerElement = document.getElementById('timer');
            timerElement.textContent = timeRemaining;
            timerElement.classList.remove('warning');

            timerInterval = setInterval(() => {
                timeRemaining--;
                timerElement.textContent = timeRemaining;

                if (timeRemaining <= 10) {
                    timerElement.classList.add('warning');
                }

                if (timeRemaining <= 0) {
                    stopTimer();
                    // Auto-submit with current input or 0 if empty
                    const currentInput = document.getElementById('answerInput').value;
                    if (currentInput === '') {
                        document.getElementById('answerInput').value = 0;
                    }
                    submitAnswer();
                }
            }, 1000);
        }

        function stopTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
        }

        // Load game data from JSON
        async function loadGameData() {
            try {
                const response = await fetch('game_data.json');
                gameData = await response.json();
                // Calculate total number of questions (sum of vegetables across all images)
                totalQuestions = gameData.reduce((sum, game) => {
                    const vegs = Object.keys(game).filter(key => key !== 'image');
                    return sum + vegs.length;
                }, 0);
            } catch (error) {
                console.error('Error loading game data:', error);
                gameData = [];
                totalQuestions = 0;
            }
        }

        function startGame() {
            currentImageIndex = 0;
            currentVegetableIndex = 0;
            currentScore = 0;
            currentQuestion = 0;
            if (totalQuestions === 0) {
                alert('Error: No game data loaded');
                return;
            }
            const container = document.querySelector('.container');
            container.classList.add('game-active');
            document.getElementById('startScreen').style.display = 'none';
            document.getElementById('gameScreen').classList.add('active');
            loadNextQuestion();
        }

        function loadNextQuestion() {
            if (currentImageIndex >= gameData.length) {
                endGame();
                return;
            }

            currentGame = gameData[currentImageIndex];

            // Get vegetable names from the JSON object (exclude 'image' property)
            vegetables = Object.keys(currentGame).filter(key => key !== 'image');

            // Check if we've asked all vegetables for this image
            if (currentVegetableIndex >= vegetables.length) {
                currentImageIndex++;
                currentVegetableIndex = 0;
                if (currentImageIndex >= gameData.length) {
                    endGame();
                    return;
                }
                currentGame = gameData[currentImageIndex];
                vegetables = Object.keys(currentGame).filter(key => key !== 'image');
            }

            currentQuestion++;
            currentVegetable = vegetables[currentVegetableIndex];

            // Update UI
            document.getElementById('gameImage').src = currentGame.image;
            document.getElementById('vegetableLabel').textContent = currentVegetable;
            document.getElementById('question').textContent = currentQuestion + '/' + totalQuestions;
            document.getElementById('answerInput').value = '';
            document.getElementById('answerInput').focus();
            document.getElementById('feedback').classList.remove('show', 'correct', 'incorrect');
            
            // Start the timer for this question
            stopTimer();
            startTimer();
        }

        function submitAnswer() {
            stopTimer();
            
            const userAnswer = parseInt(document.getElementById('answerInput').value);

            if (isNaN(userAnswer)) {
                alert('Please enter a valid number');
                return;
            }

            const correctCount = currentGame[currentVegetable];
            const feedback = document.getElementById('feedback');

            if (userAnswer === correctCount) {
                currentScore++;
                feedback.textContent = '✅ Correct! There were ' + correctCount + ' ' + currentVegetable + '!';
                feedback.classList.add('show', 'correct');
            } else {
                feedback.textContent = '❌ Wrong! The correct answer was ' + correctCount + ' ' + currentVegetable +
                                       '. You said ' + userAnswer + '.';
                feedback.classList.add('show', 'incorrect');
            }

            document.getElementById('score').textContent = currentScore;

            // Move to next vegetable
            currentVegetableIndex++;

            // Load next question after 2 seconds
            setTimeout(() => {
                loadNextQuestion();
            }, 2000);
        }

        function endGame() {
            stopTimer();
            const container = document.querySelector('.container');
            container.classList.add('game-active');
            document.getElementById('gameScreen').classList.remove('active');
            document.getElementById('endScreen').classList.add('active');
            document.getElementById('finalScore').textContent = currentScore + '/' + totalQuestions;

            let message = '';
            let emoji = '';
            const percentage = Math.round((currentScore / totalQuestions) * 100);

            if (currentScore === totalQuestions) {
                emoji = '🌟';
                message = 'Perfect score! You are a master counter!';
            } else if (percentage >= 80) {
                emoji = '😄';
                message = 'Great job! You are an excellent counter!';
            } else if (percentage >= 60) {
                emoji = '👍';
                message = 'Good effort! Keep practicing!';
            } else if (percentage >= 40) {
                emoji = '🙂';
                message = 'Not bad! Try again to improve your score!';
            } else {
                emoji = '💪';
                message = 'Better luck next time! Practice makes perfect!';
            }

            document.getElementById('endEmoji').textContent = emoji;
            document.getElementById('endMessage').textContent = message;
        }

        // Virtual Keypad Functions
        function addToInput(digit) {
            const input = document.getElementById('answerInput');
            const currentValue = input.value;
            
            // Limit to max 2 digits (0-20)
            if (currentValue.length < 2 || (currentValue.length === 1 && parseInt(currentValue + digit) <= 20)) {
                input.value = currentValue + digit;
            }
            input.focus();
        }

        function deleteLastDigit() {
            const input = document.getElementById('answerInput');
            input.value = input.value.slice(0, -1);
            input.focus();
        }

        function clearInput() {
            const input = document.getElementById('answerInput');
            input.value = '';
            input.focus();
        }

        // Allow Enter key to submit answer
        document.addEventListener('keypress', function(event) {
            if (event.key === 'Enter' && document.getElementById('gameScreen').classList.contains('active')) {
                submitAnswer();
            }
        });

        // Load game data on page load
        window.addEventListener('DOMContentLoaded', loadGameData);
    </script>
</body>
</html>
