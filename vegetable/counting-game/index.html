<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🥦🥕蔬菜计数大挑战🌽🥬</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Comic Sans MS', 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0;
            margin: 0;
        }

        .container {
            background: transparent;
            border-radius: 20px;
            box-shadow: none;
            padding: 0;
            max-width: 100%;
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .container.game-active {
            background: white;
            border-radius: 0;
            box-shadow: none;
            padding: 0;
            max-width: 100%;
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1em;
        }

        .score-board {
            display: flex;
            justify-content: space-around;
            margin-bottom: 8px;
            background: #f0f0f0;
            padding: 8px;
            border-radius: 10px;
            flex-shrink: 0;
        }

        .score-item {
            text-align: center;
        }

        .score-label {
            color: #666;
            font-size: 0.75em;
            margin-bottom: 2px;
        }

        .score-value {
            font-size: 1.3em;
            font-weight: bold;
            color: #667eea;
        }

        .game-area {
            text-align: center;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 0 10px;
        }

        .image-container {
            margin: 0;
            background: #f9f9f9;
            border-radius: 10px;
            display: none;
            flex-shrink: 0;
        }

        .image-container.active {
            display: block;
        }

        .game-image {
            max-width: 100%;
            max-height: 280px;
            height: auto;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .question {
            font-size: 1.8em;
            color: #333;
            margin: 8px 0 20px 0;
            font-weight: bold;
        }

        .vegetable-label {
            display: inline-block;
            padding: 6px 12px;
            background: #FFE4B5;
            border-radius: 25px;
            margin: 2px 0;
            font-size: 0.95em;
            color: #D2691E;
            font-weight: bold;
        }

        /* New layout: input and submit on left, keypad on right */
        .input-section {
            display: flex;
            gap: 30px;
            justify-content: center;
            align-items: flex-start;
            margin: 20px 0;
            flex-shrink: 0;
            width: 100%;
            padding: 0 10px;
            flex-wrap: wrap;
        }

        .input-controls {
            display: flex;
            flex-direction: column;
            gap: 12px;
            align-items: center;
        }

        .input-row {
            display: flex;
            justify-content: center;
        }

        input[type="number"] {
            padding: 30px 25px;
            font-size: 3em;
            border: 3px solid #667eea;
            border-radius: 16px;
            width: 264px;
            height: 172px;
            text-align: center;
            font-weight: bold;
            cursor: default;
            background-color: #f5f5f5;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        input[type="number"]:focus {
            outline: none;
            border-color: #764ba2;
            box-shadow: 0 0 10px rgba(118, 75, 162, 0.3);
        }

        /* Hide browser spinner controls */
        input[type="number"]::-webkit-outer-spin-button,
        input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        input[type="number"][type="number"] {
            -moz-appearance: textfield;
        }

        .buttons-row {
            display: flex;
            gap: 12px;
            justify-content: center;
            align-items: center;
        }

        .submit-button {
            padding: 15px 35px;
            font-size: 1.1em;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.2s, box-shadow 0.2s;
            width: 172px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .submit-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(118, 75, 162, 0.4);
        }

        .submit-button:active {
            transform: translateY(0);
        }

        .input-controls .keypad-button.delete {
            width: 80px;
            height: 80px;
            min-height: 80px;
            font-size: 1.15em;
            padding: 12px 10px;
        }

        button {
            padding: 12px 24px;
            font-size: 1em;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.2s, box-shadow 0.2s;
            height: fit-content;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(118, 75, 162, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .keypad-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .keypad {
            display: grid;
            grid-template-columns: repeat(3, 80px);
            grid-auto-rows: 80px;
            gap: 12px;
        }

        .keypad-button {
            padding: 12px 10px;
            font-size: 1.4em;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 16px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.2s, box-shadow 0.2s;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .keypad-button:hover {
            transform: scale(1.05);
            box-shadow: 0 3px 10px rgba(118, 75, 162, 0.3);
        }

        .keypad-button:active {
            transform: scale(0.98);
        }

        .keypad-button.delete {
            min-height: 80px;
            width: 80px;
            padding: 12px 10px;
            font-size: 1.15em;
            background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
        }

        .keypad-button.delete:hover {
            transform: scale(1.05);
            box-shadow: 0 3px 10px rgba(255, 120, 154, 0.3);
        }

        .keyboard-hint {
            font-size: 0.8em;
            color: #999;
            margin-top: 6px;
            text-align: center;
        }

        .feedback {
            position: fixed;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            padding: 20px 25px;
            border-radius: 12px;
            font-size: 1.05em;
            font-weight: bold;
            display: none;
            flex-shrink: 0;
            min-width: 200px;
            max-width: 280px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
            z-index: 100;
            line-height: 1.4;
        }

        .feedback.show {
            display: block;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-50%) translateX(50px);
            }
            to {
                opacity: 1;
                transform: translateY(-50%) translateX(0);
            }
        }

        .feedback.correct {
            background: #90EE90;
            color: #228B22;
            border: 2px solid #228B22;
        }

        .feedback.incorrect {
            background: #FFB6C6;
            color: #C41E3A;
            border: 2px solid #C41E3A;
        }

        .start-screen {
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 30px;
            min-height: calc(100vh - 80px);
            padding: 40px 20px;
        }

        .start-screen h1 {
            font-size: 3.5em;
            color: white;
            margin: 0;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
            letter-spacing: 0.05em;
        }

        .start-screen .subtitle {
            font-size: 1.5em;
            color: white;
            margin: 0;
            font-weight: 500;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }

        .start-screen p {
            font-size: 1.1em;
            color: #666;
            margin: 20px 0;
        }

        .vegetable-decoration {
            display: flex;
            justify-content: center;
            gap: 15px;
            font-size: 2.5em;
            margin: 20px 0;
        }

        .start-button {
            padding: 15px 40px;
            font-size: 1.3em;
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
            color: white;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .start-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }

        .start-button:active {
            transform: translateY(-1px);
        }

        .end-screen {
            text-align: center;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 20px;
            min-height: 100vh;
            padding: 40px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            width: 100%;
        }

        .end-screen.active {
            display: flex;
        }

        .end-screen h1 {
            font-size: 3em;
            color: white;
            margin: 0;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .emoji {
            font-size: 4em;
            margin: 20px 0;
            animation: bounce 0.6s infinite alternate;
        }

        @keyframes bounce {
            from { transform: translateY(0); }
            to { transform: translateY(-20px); }
        }

        .final-score {
            font-size: 2.5em;
            font-weight: bold;
            color: #FFD700;
            margin: 20px 0;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .game-screen {
            display: none;
            flex-direction: column;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .game-screen.active {
            display: flex;
        }

        .game-screen .game-area {
            flex: 1;
            overflow-y: auto;
        }

        .timer-container {
            text-align: center;
            padding: 10px;
            background: #f0f0f0;
            border-bottom: 1px solid #ddd;
            flex-shrink: 0;
        }

        .timer {
            font-size: 1.3em;
            font-weight: bold;
            color: #667eea;
        }

        .timer.warning {
            color: #ff6b6b;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        @media (max-width: 768px) {
            .input-section {
                flex-direction: column;
                gap: 20px;
            }

            .input-controls .keypad-button.delete {
                width: 100%;
                max-width: 140px;
                min-height: 55px;
                font-size: 1em;
                padding: 10px 8px;
            }

            .keypad {
                grid-template-columns: repeat(3, 65px);
                grid-auto-rows: 65px;
                gap: 10px;
            }

            .keypad-button {
                min-height: 65px;
                font-size: 1.2em;
                padding: 10px 8px;
            }

            .keypad-button.delete {
                min-height: 65px;
                width: 65px;
                font-size: 1em;
                padding: 10px 8px;
            }

            input[type="number"] {
                width: 229px;
                height: 140px;
                padding: 20px 20px;
                font-size: 2.5em;
            }

            .submit-button {
                width: 152px;
                height: 65px;
                padding: 12px 25px;
                font-size: 0.95em;
            }

            .feedback {
                right: 10px;
                max-width: 200px;
                font-size: 0.95em;
                padding: 15px 20px;
            }

            .question {
                font-size: 1.5em;
            }
        }

        @media (max-width: 480px) {
            .input-controls .keypad-button.delete {
                width: 55px;
                height: 55px;
                min-height: 55px;
                font-size: 0.95em;
                padding: 8px 6px;
            }

            .submit-button {
                width: 132px;
                height: 55px;
                padding: 10px 20px;
                font-size: 0.9em;
            }

            .keypad {
                grid-template-columns: repeat(3, 55px);
                grid-auto-rows: 55px;
                gap: 8px;
            }

            .keypad-button {
                min-height: 55px;
                font-size: 1.1em;
            }

            .keypad-button.delete {
                min-height: 55px;
                width: 55px;
                font-size: 0.95em;
                padding: 8px 6px;
            }

            input[type="number"] {
                width: 199px;
                height: 118px;
                padding: 10px 12px;
                font-size: 2em;
            }

            .feedback {
                right: 10px;
                left: 10px;
                max-width: none;
                font-size: 0.9em;
                padding: 12px 15px;
                top: auto;
                bottom: 100px;
                transform: none;
            }

            .question {
                font-size: 1.4em;
            }
        }
    </style>
</head>

<body>
    <div class="container" id="container">
        <!-- Start Screen -->
        <div class="start-screen" id="startScreen">
            <h1>🥦🥕蔬菜计数大挑战🌽🥬</h1>
            <button class="start-button" onclick="startGame()">开始游戏</button>
        </div>

        <!-- Game Screen -->
        <div class="game-screen" id="gameScreen">
            <div class="timer-container">
                <div class="timer" id="timer">30</div>
            </div>

            <div class="score-board">
                <div class="score-item">
                    <div class="score-label">Points</div>
                    <div class="score-value" id="score">0</div>
                </div>
                <div class="score-item">
                    <div class="score-label">Question</div>
                    <div class="score-value" id="question">1/5</div>
                </div>
            </div>

            <div class="game-area">
                <div class="image-container active" id="imageContainer">
                    <img id="gameImage" class="game-image" src="" alt="Vegetable image">
                </div>

                <p class="question">你看到多少 <span class="vegetable-label" id="vegetableLabel">vegetable</span> ？</p>

                <!-- Improved Layout: Input and Submit on left, Keypad on right -->
                <div class="input-section">
                    <div class="input-controls">
                        <div class="input-row">
                            <input type="number" id="answerInput" placeholder="0" min="0" max="20" inputmode="none" readonly>
                        </div>
                        <div class="buttons-row">
                            <button class="submit-button" onclick="submitAnswer()">提交</button>
                            <button class="keypad-button delete" onclick="deleteLastDigit()">❌️</button>
                        </div>
                    </div>

                    <div class="keypad-container">
                        <div class="keypad">
                            <button class="keypad-button number" onclick="addToInput('1')">1</button>
                            <button class="keypad-button number" onclick="addToInput('2')">2</button>
                            <button class="keypad-button number" onclick="addToInput('3')">3</button>
                            <button class="keypad-button number" onclick="addToInput('4')">4</button>
                            <button class="keypad-button number" onclick="addToInput('5')">5</button>
                            <button class="keypad-button number" onclick="addToInput('6')">6</button>
                            <button class="keypad-button number" onclick="addToInput('7')">7</button>
                            <button class="keypad-button number" onclick="addToInput('8')">8</button>
                            <button class="keypad-button number" onclick="addToInput('9')">9</button>
                        </div>
                    </div>
                </div>

                <div class="feedback" id="feedback"></div>
            </div>
        </div>

        <!-- End Screen -->
        <div class="end-screen" id="endScreen">
            <h1>游戏结束🎉</h1>
            <div class="emoji" id="endEmoji">🎊</div>
            <p style="font-size: 1.2em; color: white;">总分:</p>
            <div class="final-score" id="finalScore">0 points</div>
            <div style="background: rgba(255,255,255,0.1); padding: 15px 30px; border-radius: 10px; margin: 15px 0;">
                <p style="font-size: 0.95em; color: white; margin: 5px 0;">✅ 正确: <span id="correctCount" style="font-weight: bold;">0</span></p>
                <p style="font-size: 0.95em; color: white; margin: 5px 0;">❌ 错误: <span id="wrongCount" style="font-weight: bold;">0</span></p>
            </div>
            <p style="font-size: 1.1em; color: white; margin: 20px 0;" id="endMessage"></p>
            <button class="start-button" onclick="location.reload()" style="width: auto;">重新开始</button>
        </div>
    </div>

    <script>
        let gameData = [];
        let currentImageIndex = 0;
        let currentVegetableIndex = 0;
        let currentScore = 0;
        let totalQuestions = 0;
        let currentQuestion = 0;
        let currentGame = null;
        let currentVegetable = null;
        let vegetables = [];
        let timerInterval = null;
        let timeRemaining = 30;
        let correctAnswers = 0;
        let wrongAnswers = 0;
        const TIMER_DURATION = 30;

        function startTimer() {
            timeRemaining = TIMER_DURATION;
            const timerElement = document.getElementById('timer');
            timerElement.textContent = timeRemaining;
            timerElement.classList.remove('warning');

            timerInterval = setInterval(() => {
                timeRemaining--;
                timerElement.textContent = timeRemaining;

                if (timeRemaining <= 10) {
                    timerElement.classList.add('warning');
                }

                if (timeRemaining <= 0) {
                    stopTimer();
                    // Auto-submit with current input or 0 if empty
                    const currentInput = document.getElementById('answerInput').value;
                    if (currentInput === '') {
                        document.getElementById('answerInput').value = 0;
                    }
                    submitAnswer();
                }
            }, 1000);
        }

        function stopTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
        }

        // Default game data
        const defaultGameData = [
            {
                "image": "Slide1.JPG",
                "qié zi": 3,
                "nán guā": 4,
                "bāo cài": 6
            },
            {
                "image": "Slide2.JPG",
                "kǔ guā": 5,
                "bái cài": 4,
                "là jiāo": 7
            }
        ];

        // Load game data from JSON
        async function loadGameData() {
            try {
                const response = await fetch('game_data.json');
                gameData = await response.json();
                // Calculate total number of questions (sum of vegetables across all images)
                totalQuestions = gameData.reduce((sum, game) => {
                    const vegs = Object.keys(game).filter(key => key !== 'image');
                    return sum + vegs.length;
                }, 0);
            } catch (error) {
                console.error('Error loading game data:', error);
                console.log('Using default game data...');
                gameData = defaultGameData;
                // Calculate total number of questions
                totalQuestions = gameData.reduce((sum, game) => {
                    const vegs = Object.keys(game).filter(key => key !== 'image');
                    return sum + vegs.length;
                }, 0);
            }
        }

        function startGame() {
            currentImageIndex = 0;
            currentVegetableIndex = 0;
            currentScore = 0;
            currentQuestion = 0;
            correctAnswers = 0;
            wrongAnswers = 0;
            const container = document.querySelector('.container');
            container.classList.add('game-active');
            document.getElementById('startScreen').style.display = 'none';
            document.getElementById('gameScreen').classList.add('active');
            loadNextQuestion();
        }

        function loadNextQuestion() {
            if (currentImageIndex >= gameData.length) {
                endGame();
                return;
            }

            currentGame = gameData[currentImageIndex];

            // Get vegetable names from the JSON object (exclude 'image' property)
            vegetables = Object.keys(currentGame).filter(key => key !== 'image');

            // Check if we've asked all vegetables for this image
            if (currentVegetableIndex >= vegetables.length) {
                currentImageIndex++;
                currentVegetableIndex = 0;
                if (currentImageIndex >= gameData.length) {
                    endGame();
                    return;
                }
                currentGame = gameData[currentImageIndex];
                vegetables = Object.keys(currentGame).filter(key => key !== 'image');
            }

            currentQuestion++;
            currentVegetable = vegetables[currentVegetableIndex];

            // Update UI
            document.getElementById('gameImage').src = currentGame.image;
            document.getElementById('vegetableLabel').textContent = currentVegetable;
            document.getElementById('question').textContent = currentQuestion + '/' + totalQuestions;
            document.getElementById('answerInput').value = '';
            document.getElementById('feedback').classList.remove('show', 'correct', 'incorrect');
            
            // Start the timer for this question
            stopTimer();
            startTimer();
        }

        function submitAnswer() {
            stopTimer();
            
            const inputValue = document.getElementById('answerInput').value.trim();
            const feedback = document.getElementById('feedback');

            // Check for blank answer
            if (inputValue === '') {
                feedback.textContent = '⚠️ Please enter a number!';
                feedback.classList.add('show');
                feedback.classList.remove('correct', 'incorrect');
                feedback.style.background = '#FFF9C4';
                feedback.style.color = '#F57F17';
                feedback.style.border = '2px solid #F57F17';
                
                // Move to next question after 2 seconds
                setTimeout(() => {
                    currentVegetableIndex++;
                    loadNextQuestion();
                }, 2000);
                return;
            }

            const userAnswer = parseInt(inputValue);

            if (isNaN(userAnswer)) {
                alert('Please enter a valid number');
                return;
            }

            const correctCount = currentGame[currentVegetable];

            if (userAnswer === correctCount) {
                correctAnswers++;
                currentScore += 100;
                feedback.textContent = '✅ Correct! (+100 points)';
                feedback.classList.add('show', 'correct');
                feedback.classList.remove('incorrect');
                feedback.style.background = '#90EE90';
                feedback.style.color = '#228B22';
                feedback.style.border = '2px solid #228B22';
            } else {
                wrongAnswers++;
                currentScore = Math.max(0, currentScore - 20);
                feedback.textContent = '❌ Wrong! (-20 points) Correct answer: ' + correctCount + ' ' + currentVegetable;
                feedback.classList.add('show', 'incorrect');
                feedback.classList.remove('correct');
                feedback.style.background = '#FFB6C6';
                feedback.style.color = '#C41E3A';
                feedback.style.border = '2px solid #C41E3A';
            }

            document.getElementById('score').textContent = currentScore;

            // Move to next vegetable
            currentVegetableIndex++;

            // Load next question after 2 seconds
            setTimeout(() => {
                loadNextQuestion();
            }, 2000);
        }

        function endGame() {
            stopTimer();
            const container = document.querySelector('.container');
            container.classList.add('game-active');
            document.getElementById('gameScreen').classList.remove('active');
            document.getElementById('endScreen').classList.add('active');
            
            // Calculate how many were correct (perfect score would be totalQuestions * 100)
            // We can estimate based on the score, but let's track it properly
            // For now, display total points
            document.getElementById('finalScore').textContent = currentScore + ' points';

            let message = '';
            let emoji = '';
            
            // Score ranges based on points
            const maxPossibleScore = totalQuestions * 100;

            if (currentScore === maxPossibleScore) {
                emoji = '🌟';
                message = 'Perfect score! You are a master counter!';
            } else if (currentScore >= maxPossibleScore * 0.8) {
                emoji = '😄';
                message = 'Great job! You are an excellent counter!';
            } else if (currentScore >= maxPossibleScore * 0.6) {
                emoji = '👍';
                message = 'Good effort! Keep practicing!';
            } else if (currentScore >= maxPossibleScore * 0.4) {
                emoji = '🙂';
                message = 'Not bad! Try again to improve your score!';
            } else if (currentScore > 0) {
                emoji = '💪';
                message = 'Better luck next time! Practice makes perfect!';
            } else {
                emoji = '😅';
                message = 'Don\'t give up! Try again!';
            }

            document.getElementById('endEmoji').textContent = emoji;
            document.getElementById('endMessage').textContent = message;
            document.getElementById('correctCount').textContent = correctAnswers;
            document.getElementById('wrongCount').textContent = wrongAnswers;
        }

        // Virtual Keypad Functions
        function addToInput(digit) {
            const input = document.getElementById('answerInput');
            const currentValue = input.value;
            
            // Limit to max 2 digits (0-20)
            if (currentValue.length < 2 || (currentValue.length === 1 && parseInt(currentValue + digit) <= 20)) {
                input.value = currentValue + digit;
            }
        }

        function deleteLastDigit() {
            const input = document.getElementById('answerInput');
            input.value = input.value.slice(0, -1);
        }

        function clearInput() {
            const input = document.getElementById('answerInput');
            input.value = '';
        }

        // Allow Enter key to submit answer
        document.addEventListener('keypress', function(event) {
            if (event.key === 'Enter' && document.getElementById('gameScreen').classList.contains('active')) {
                submitAnswer();
            }
        });

        // Prevent keyboard popup on input field for iPad
        document.addEventListener('DOMContentLoaded', function() {
            const answerInput = document.getElementById('answerInput');
            if (answerInput) {
                answerInput.addEventListener('focus', function(e) {
                    this.blur();
                });
                answerInput.addEventListener('touchstart', function(e) {
                    e.preventDefault();
                    this.blur();
                });
            }
        });

        // Load game data on page load
        window.addEventListener('DOMContentLoaded', loadGameData);
    </script>
</body>
</html>
