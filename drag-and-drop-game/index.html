<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Prevents iPad screen shrinking, zooming, or scrolling while dragging -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>U13 Dragging Game</title>
  
  <!-- Include SortableJS for flawless iPad Touch-and-Drag support -->
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none; /* Prevents text/image selection on iOS */
      -webkit-touch-callout: none;
    }

    body {
      margin: 0;
      padding: 15px;
      font-family: Arial, sans-serif;
      background-color: #f4f7f6;
      height: 100vh;
      width: 100vw;
      overflow: hidden; /* Locks screen scrolling for iPad */
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Main Container optimized for iPad Screen Dimensions */
    .game-container {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      max-width: 1024px;
      height: 95vh;
      gap: 15px;
    }

    /* Left Section: Score Panel */
    .score-panel {
      width: 160px;
      height: 100%;
      background: #ffffff;
      border: 3px solid #4CAF50;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }

    .score-title {
      font-size: 1.2rem;
      font-weight: bold;
      color: #333;
      margin-bottom: 8px;
    }

    .score-display {
      font-size: 1.8rem;
      font-weight: bold;
      color: #2E7D32;
      background: #E8F5E9;
      padding: 10px 15px;
      border-radius: 8px;
      margin-bottom: 25px;
      min-width: 100px;
      text-align: center;
    }

    .add-btn {
      width: 65px;
      height: 65px;
      font-size: 2.2rem;
      color: white;
      background-color: #FF9800;
      border: none;
      border-radius: 50%;
      box-shadow: 0 4px 6px rgba(0,0,0,0.2);
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: transform 0.1s;
    }

    .add-btn:active {
      transform: scale(0.92);
      background-color: #F57C00;
    }

    /* Middle Section: Plate Container */
    .plate-panel {
      flex: 1;
      height: 100%;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      background-image: url('plate.jpg');
      background-size: contain;
      background-position: center;
      background-repeat: no-repeat;
      border-radius: 12px;
    }

    /* Plate drop zone overlay grid to allow free placement */
    #plate-zone {
      width: 80%;
      height: 80%;
      display: flex;
      flex-wrap: wrap;
      align-content: flex-start;
      justify-content: center;
      gap: 10px;
      padding: 20px;
      overflow: hidden;
    }

    /* Right Section: 2-Column Vegetable Inventory */
    .inventory-panel {
      width: 240px;
      height: 100%;
      background: #ffffff;
      border: 3px solid #2196F3;
      border-radius: 12px;
      padding: 10px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }

    #inventory-zone {
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      grid-auto-rows: max-content;
      gap: 10px;
      overflow-y: auto;
    }

    /* Item Card Styling */
    .drag-item {
      width: 95px;
      height: 95px;
      object-fit: contain;
      border-radius: 8px;
      border: 1px solid #ddd;
      background-color: #fafafa;
      touch-action: none; /* Disables iPad default gesture scrolling on items */
      cursor: grab;
    }

    .drag-item:active {
      cursor: grabbing;
    }
  </style>
</head>
<body>

  <div class="game-container">
    
    <!-- 1. Left Score Panel -->
    <div class="score-panel">
      <div class="score-title">SCORE</div>
      <div id="score" class="score-display">0</div>
      <button class="add-btn" onclick="addScore()">+</button>
    </div>

    <!-- 2. Middle Plate Dropzone -->
    <div class="plate-panel">
      <div id="plate-zone"></div>
    </div>

    <!-- 3. Right 2-Column Inventory Panel -->
    <div class="inventory-panel">
      <div id="inventory-zone">
        <img src="nan.jpg" class="drag-item" alt="nan">
        <img src="yi.jpg" class="drag-item" alt="yi">
        <img src="cu.jpg" class="drag-item" alt="cu">
        <img src="xi.jpg" class="drag-item" alt="xi">
        <img src="qiang.jpg" class="drag-item" alt="qiang">
        <img src="tui.jpg" class="drag-item" alt="tui">
        <img src="tao.jpg" class="drag-item" alt="tao">
        <img src="yan.jpg" class="drag-item" alt="yan">
        <img src="zheng.jpg" class="drag-item" alt="zheng">
        <img src="chao.jpg" class="drag-item" alt="chao">
        <img src="nong.jpg" class="drag-item" alt="nong">
        <img src="po.jpg" class="drag-item" alt="po">
        <img src="zhuang.jpg" class="drag-item" alt="zhuang">
        <img src="dao.jpg" class="drag-item" alt="dao">
        <img src="shang.jpg" class="drag-item" alt="shang">
      </div>
    </div>

  </div>

  <script>
    // Score Logic
    let score = 0;
    function addScore() {
      score += 1000;
      document.getElementById('score').innerText = score;
    }

    // Touch-optimized Drag and Drop using SortableJS
    const inventoryZone = document.getElementById('inventory-zone');
    const plateZone = document.getElementById('plate-zone');

    // Make Right Inventory a drag source
    new Sortable(inventoryZone, {
      group: 'plateGroup',
      animation: 150,
      fallbackOnBody: true,
      swapThreshold: 0.65
    });

    // Make Plate Container a drop zone
    new Sortable(plateZone, {
      group: 'plateGroup',
      animation: 150,
      fallbackOnBody: true,
      swapThreshold: 0.65
    });

    // Prevent iPad default pull-to-refresh or bounce scrolling
    document.body.addEventListener('touchmove', function(e) {
      e.preventDefault();
    }, { passive: false });
  </script>

</body>
</html>
